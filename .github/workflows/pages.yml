name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'feat/**']
  delete:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: SRC/package-lock.json

      - run: npm ci
        working-directory: SRC

      - run: npm run build
        working-directory: SRC

      - run: npm run docs
        working-directory: SRC

      - run: cp -r SRC/docs ./pkg/docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pkg
          destination_dir: ${{ github.ref_name == 'main' && '.' || github.ref_name }}
          keep_files: true

  cleanup:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Remove deleted branch directory
        run: |
          git rm -rf "${{ github.event.ref }}" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove deploy for deleted branch ${{ github.event.ref }}" || exit 0
          git push
